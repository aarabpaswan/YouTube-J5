name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set or not a valid directory."
            exit 1
          fi
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version string: $JAVA_VERSION_OUTPUT"
          DETECTED_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$DETECTED_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version from '$JAVA_VERSION_OUTPUT'."
            exit 1
          fi
          echo "Detected Java major version: $DETECTED_MAJOR"
          if [ "$DETECTED_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($DETECTED_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $DETECTED_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore"
          else
            echo "Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching in app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $TARGET_APK"; exit 1 ;;
          esac
          echo "Verified APK exists and is non-empty: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          STAGING_DIR="${RUNNER_TEMP:-/tmp}/release-apk-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SOURCE_APK" "$STAGING_DIR/app-debug.apk"
          if [ ! -f "$STAGING_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare release asset."
            exit 1
          fi
          echo "asset_path=$STAGING_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at $STAGING_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK not found at '$ASSET_PATH'"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            */app-debug.apk) ;;
            *) echo "ERROR: Asset filename is not app-debug.apk: $ASSET_PATH"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES="## Automatic Debug APK Build

- **Build System:** GitHub Actions
- **Run Number:** ${{ github.run_number }}
- **Run Attempt:** ${{ github.run_attempt }}
- **Source Commit:** ${{ github.sha }}

> **Note:** This is an automatically generated debug APK intended for testing only.
> It is signed with a temporary debug keystore and is not a Play Store production release."

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "=== Release Published Successfully ==="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            echo "Backup artifact 'app-debug-apk' remains available in GitHub Actions."

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions backup artifact **app-debug-apk** is also available on this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and artifact 'app-debug-apk' remains available for download under GitHub Actions summary."
            fi
            echo "## Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publication failed or was skipped, but the Actions backup artifact **app-debug-apk** remains available." >> "$GITHUB_STEP_SUMMARY"
          fi
